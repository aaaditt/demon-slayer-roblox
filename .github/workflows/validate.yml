name: Validate and build Roblox place
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python scripts/bootstrap.py
      - run: python scripts/check.py
      - name: Verify generated data is current
        run: git diff --exit-code -- src/shared/Content.luau docs/CONTENT_INVENTORY.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WisteriaChronicles-place
          path: build/WisteriaChronicles.rbxlx
          if-no-files-found: error
